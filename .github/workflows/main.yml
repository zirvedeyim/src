name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # Repoya dosya yazma izni

    steps:
      - name: Kodu Repodan Çek
        uses: actions/checkout@v4

      - name: Theos, SDK ve ldid Kur
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          curl -L -o sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf sdks.tar.gz
          mv sdks-master sdks
          rm sdks.tar.gz
          
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Projeyi Derle
        run: |
          make clean
          make

      - name: Dylib'i Ana Dizine Taşı ve Repoya Gönder
        run: |
          # Oluşan dylib dosyasını bul ve ana dizine kopyala
          find .theos/obj -name "*.dylib" -exec cp {} ./ \;
          
          # Git ayarlarını yap
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Yeni oluşan dylib dosyasını repoya ekle
          git add *.dylib
          git commit -m "Otomatik derlenen dylib dosyasi eklendi" || echo "Degisiklik yok"
          git push
