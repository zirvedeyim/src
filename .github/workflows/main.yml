name: Build Dylib and Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu Repodan Çek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Theos ve SDK Kur
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          
          # SDK indir
          curl -L -o sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf sdks.tar.gz
          mv sdks-master sdks
          rm sdks.tar.gz
          
          # ldid indir
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Projeyi Derle (Paket ve Dylib)
        run: |
          make clean
          make package FINALPACKAGE=1
          
          # Deb dosyasinin olustugu packages klasorunu bul
          mkdir -p packages
          
          # Derlenen .dylib dosyasini bul ve dogrudan packages klasorunun icine (deb'in yanina) kopyala
          find .theos/obj -name "*.dylib" -exec cp {} packages/ \;

      - name: Derlenen Dosyalari Yukle (Hem Deb Hem Dylib)
        uses: actions/upload-artifact@v4
        with:
          name: M7MD-Outputs
          # Artik sadece packages klasorunu yukluyoruz, icinde hem deb hem dylib olacak
          path: packages/
          if-no-files-found: error
