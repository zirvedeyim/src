name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kodu Repodan Çek
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Theos ve SDK Kur
        run: |
          # Theos'u kur
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          
          # iOS SDK'larını indir
          curl -L -o sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf sdks.tar.gz
          mv sdks-master sdks
          rm sdks.tar.gz
          
          # ldid (imzalama araci) indir
          curl -L -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          
          # Ortam degiskenlerini ayarla
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Projeyi Derle
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Derlenen Dosyalari Yukle
        uses: actions/upload-artifact@v4
        with:
          name: M7MD-Dylib-Output
          # Hem .deb hem de .dylib dosyalarini paketler
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
          if-no-files-found: warn
